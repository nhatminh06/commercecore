<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">CommerceCore Consistency Lab · qualified scope</title>
<desc id="desc">Separate local database snapshots, controlled gRPC faults, and CommerceCore service-call histories feed independent scoped checks. The evidence streams do not form a shared transaction or one cross-system timeline.</desc>
