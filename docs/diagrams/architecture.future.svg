<desc id="desc">Future test-only scenario generator and fault injector exercise isolated CommerceCore systems. Planned collectors feed an independent oracle and history checker. Planned replay engine and debugger inspect evidence offline. Only the M15a synthetic oracle currently exists.</desc>
