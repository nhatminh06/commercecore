<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">CommerceCore · current architecture</title>
<desc id="desc">Browser reaches Next.js through Caddy in production. Next.js calls the modular CommerceCore Spring Boot app by REST. CommerceCore owns its PostgreSQL store, uses gRPC to a separate Payment Service with its own PostgreSQL, and publishes outbox events to Kafka. Two consumer groups receive events independently.</desc>
