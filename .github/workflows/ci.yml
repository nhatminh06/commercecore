name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency-lab:
    name: Offline oracle qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools/consistency_lab -p 'test_*.py'
      - name: Verify labeled synthetic fixture
        run: |
          python tools/consistency_lab/oracle.py tools/consistency_lab/fixtures/valid.json | python -c 'import json,sys; r=json.load(sys.stdin); assert r["run_id"] == "synthetic-example" and {x["property"] for x in r["results"]} == {"inventory_nonnegative", "checkout_identity", "order_reservation_state"} and all(x["verdict"] == "PASS" for x in r["results"])'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean test
      - run: ./gradlew build

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DEMO_MODE: public
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --webpack
      - run: npm audit

  deployment-config:
    name: Production Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        run: |
          scripts/validate-production-env.sh --env-file deploy/ci.production.env
          docker compose --env-file deploy/ci.production.env -f compose.prod.yml config --quiet
