spring:
  application:
    name: commercecore
  datasource:
    url: ${COMMERCECORE_DB_URL:jdbc:postgresql://localhost:5432/commercecore}
    username: ${COMMERCECORE_DB_USER:commercecore}
    password: ${COMMERCECORE_DB_PASSWORD:commercecore}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Only actually used when the "kafka" profile is active — see docs/kafka.md and
  # com.commercecore.outbox.RecordingEventSink's @Profile("!kafka"). Harmless to bind otherwise:
  # no bean actually opens a Kafka connection unless that profile is active.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
    consumer:
      group-id: commercecore-proof-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false

commercecore:
  payment:
    grpc:
      host: ${PAYMENT_SERVICE_HOST:localhost}
      port: ${PAYMENT_SERVICE_PORT:9090}
      deadline-ms: ${PAYMENT_GRPC_DEADLINE_MS:500}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
