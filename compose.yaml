services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commercecore
      POSTGRES_USER: commercecore
      POSTGRES_PASSWORD: commercecore
    ports:
      - "5432:5432"
    volumes:
      - commercecore-postgres-data:/var/lib/postgresql/data

  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_provider
      POSTGRES_USER: payment_provider
      POSTGRES_PASSWORD: payment_provider
    ports:
      - "5433:5432"
    volumes:
      - payment-provider-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_provider -d payment_provider"]
      interval: 2s
      timeout: 3s
      retries: 20

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/payment_provider
      PAYMENT_DB_USER: payment_provider
      PAYMENT_DB_PASSWORD: payment_provider
      PAYMENT_GRPC_PORT: 9090
      PAYMENT_HTTP_PORT: 8091
    ports:
      - "9090:9090"
      - "8091:8091"
    depends_on:
      payment-postgres:
        condition: service_healthy

  # Single-node Kafka in KRaft mode (no ZooKeeper) — the official Apache image supports this
  # directly. One broker means replication factor 1: this proves delivery mechanics, not
  # multi-node fault tolerance. See docs/kafka.md.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MTIzNDU2Nzg5MGFiY2RlZg

volumes:
  commercecore-postgres-data:
  payment-provider-postgres-data:
